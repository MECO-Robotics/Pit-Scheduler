<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MECO 8324 — Team Scheduler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:       #0a1628;
      --navy-mid:   #0f2044;
      --navy-light: #1a3060;
      --navy-border:#1e3a6e;
      --red:        #c0392b;
      --red-bright: #e74c3c;
      --white:      #f0f4ff;
      --gray:       #8fa3c8;
      --gray-dim:   #4a6080;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      font-size: 16px;
    }

    /* TOP BAR */
    .topbar {
      background: var(--navy-mid);
      border-bottom: 3px solid var(--red);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.04em; white-space: nowrap; }
    .brand span { color: var(--red-bright); }
    .brand-sub { font-size: 0.55rem; color: var(--gray); letter-spacing: 0.1em; text-transform: uppercase; }
    .topbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .clock { font-size: 0.68rem; color: var(--gray-dim); white-space: nowrap; display: none; }
    @media (min-width: 600px) { .clock { display: inline; } }

    /* NOW PANEL */
    .now-panel {
      background: linear-gradient(135deg, #0f2044, #1a1a3e);
      border-bottom: 1px solid var(--navy-border);
      padding: 12px 16px;
    }
    .now-panel h2 { font-size: 0.62rem; color: var(--red-bright); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
    .now-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .now-card {
      background: var(--navy);
      border: 1px solid var(--navy-border);
      border-radius: 8px;
      padding: 8px 12px;
      flex: 1;
      min-width: 130px;
      max-width: 220px;
    }
    .now-card.pit      { border-left: 3px solid var(--red-bright); }
    .now-card.scouting { border-left: 3px solid #60a5fa; }
    .now-name { font-weight: 600; font-size: 0.88rem; }
    .now-meta { font-size: 0.7rem; color: var(--gray); margin-top: 2px; }
    .now-empty { color: var(--gray-dim); font-size: 0.8rem; font-style: italic; }

    /* NEXT UP */
    .nextup-panel {
      background: var(--navy-mid);
      border-bottom: 1px solid var(--navy-border);
      padding: 8px 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nextup-label { font-size: 0.62rem; color: var(--gray-dim); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; white-space: nowrap; padding-top: 6px; }
    .nextup-items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .nextup-item {
      background: var(--navy);
      border: 1px solid var(--navy-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nextup-countdown { color: var(--red-bright); font-weight: 700; font-size: 0.7rem; }

    /* DAY TABS */
    .day-tabs {
      display: flex;
      border-bottom: 1px solid var(--navy-border);
      background: var(--navy-mid);
      padding: 0 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      padding: 11px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gray-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      flex-shrink: 0;
    }
    .day-tab:hover { color: var(--gray); }
    .day-tab.active { color: var(--white); border-bottom-color: var(--red-bright); }

    /* MAIN */
    .main { max-width: 960px; margin: 0 auto; padding: 16px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    @media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat { background: var(--navy-mid); border: 1px solid var(--navy-border); border-radius: 8px; padding: 10px 12px; }
    .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--red-bright); line-height: 1; }
    .stat-label { color: var(--gray-dim); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

    /* CARD */
    .card { background: var(--navy-mid); border: 1px solid var(--navy-border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .section-label { font-size: 0.62rem; color: var(--red-bright); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }

    /* FORM */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (min-width: 600px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px) { .form-grid { grid-template-columns: repeat(5, 1fr); } }
    .form-group label { display: block; font-size: 0.65rem; color: var(--gray-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 10px;
      background: var(--navy); border: 1px solid var(--navy-border);
      border-radius: 6px; color: var(--white); font-size: 0.9rem;
      outline: none; transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--red); }
    .form-group select option { background: var(--navy-mid); }

    /* BUTTONS */
    .btn {
      padding: 10px 16px;
      border: none; border-radius: 6px;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover:not(:disabled) { background: var(--red-bright); }
    .btn-outline { background: transparent; color: var(--gray); border: 1px solid var(--navy-border); }
    .btn-outline:hover:not(:disabled) { border-color: var(--gray); color: var(--white); }
    .btn-sm { padding: 6px 10px; font-size: 0.76rem; border-radius: 5px; background: var(--navy-light); color: var(--gray); border: 1px solid var(--navy-border); }
    .btn-danger { padding: 6px 10px; font-size: 0.76rem; border-radius: 5px; background: transparent; color: var(--red-bright); border: 1px solid #7f1d1d; }
    .btn-resend { padding: 6px 10px; font-size: 0.76rem; border-radius: 5px; background: transparent; color: #fbbf24; border: 1px solid #78350f; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar select {
      padding: 8px 10px; background: var(--navy); border: 1px solid var(--navy-border);
      border-radius: 6px; color: var(--white); font-size: 0.82rem; outline: none;
      -webkit-appearance: none; flex: 1; min-width: 120px;
    }
    .toolbar-label { font-size: 0.65rem; color: var(--gray-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .toolbar-gap { flex: 1; }

    /* TABLE — scrollable on mobile */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 580px; }
    th { text-align: left; padding: 9px 10px; color: var(--gray-dim); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--navy-border); font-weight: 600; }
    td { padding: 10px 10px; border-bottom: 1px solid rgba(30,58,110,0.4); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    /* MOBILE CARD VIEW — show instead of table on small screens */
    .shift-cards { display: none; }
    @media (max-width: 600px) {
      .table-scroll { display: none; }
      .shift-cards  { display: block; }
    }
    .shift-card {
      background: var(--navy);
      border: 1px solid var(--navy-border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .shift-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .shift-card-name { font-weight: 600; font-size: 0.92rem; }
    .shift-card-meta { font-size: 0.76rem; color: var(--gray); margin-bottom: 8px; }
    .shift-card-actions { display: flex; gap: 6px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .badge-pit      { background: rgba(192,57,43,0.2); color: #f87171; border: 1px solid rgba(192,57,43,0.35); }
    .badge-scouting { background: rgba(96,165,250,0.15); color: #93c5fd; border: 1px solid rgba(96,165,250,0.3); }
    .badge-past     { background: rgba(71,85,105,0.35); color: #94a3b8; border: 1px solid rgba(100,116,139,0.45); }
    .badge-live     { background: rgba(52,211,153,0.18); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.35); }
    .badge-upcoming { background: rgba(148,163,184,0.12); color: var(--gray); border: 1px solid var(--navy-border); }

    tr.shift-past td { color: var(--gray-dim); }
    tr.shift-past .badge-pit, tr.shift-past .badge-scouting { opacity: 0.7; }
    .shift-card.shift-past { opacity: 0.88; border-color: #243552; }
    .shift-card.shift-past .shift-card-meta { color: var(--gray-dim); }

    .sent-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; }
    .sent-dot.yes { background: #34d399; }
    .sent-dot.no  { background: var(--navy-border); }

    .actions-cell { display: flex; gap: 5px; flex-wrap: wrap; }

    .empty { text-align: center; padding: 32px; color: var(--gray-dim); font-size: 0.85rem; }

    .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--red-bright); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 16px; right: 16px; left: 16px; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; text-align: center; }
    @media (min-width: 500px) { .toast { left: auto; min-width: 260px; max-width: 360px; } }
    .toast.show { opacity: 1; }
    .toast-ok  { background: #0a2a1a; color: #6ee7b7; border: 1px solid #065f46; }
    .toast-err { background: #2a0a0a; color: #fca5a5; border: 1px solid #991b1b; }

    textarea {
      width: 100%; height: 80px;
      background: var(--navy); border: 1px solid var(--navy-border);
      border-radius: 6px; color: var(--white);
      padding: 10px; font-size: 0.78rem;
      font-family: monospace; outline: none; resize: vertical;
    }
    textarea:focus { border-color: var(--red); }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <svg width="36" height="36" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <polygon points="50,5 95,27.5 95,87.5 50,110 5,87.5 5,27.5" fill="#0f2044" stroke="#c0392b" stroke-width="6"/>
      <text x="50" y="74" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#f0f4ff">8324</text>
      <polygon points="50,20 57,36 50,32 43,36" fill="#c0392b"/>
      <rect x="47" y="32" width="6" height="16" fill="#8fa3c8"/>
    </svg>
    <div>
      <div class="brand">TEAM <span>MECO</span></div>
      <div class="brand-sub">Scheduler</div>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="clock" id="clock"></span>
    <button class="btn btn-outline" style="padding:8px 10px;font-size:0.78rem;" onclick="postSchedule()">Post to Slack</button>
    <button class="btn btn-red" style="padding:8px 10px;font-size:0.78rem;" onclick="activateNotifications()">Activate</button>
  </div>
</div>

<!-- WHO'S ON NOW -->
<div class="now-panel">
  <h2>On Duty Right Now</h2>
  <div class="now-grid" id="nowGrid"><div class="now-empty">Loading...</div></div>
</div>

<!-- NEXT UP -->
<div class="nextup-panel">
  <span class="nextup-label">Next Up</span>
  <div class="nextup-items" id="nextUpItems"></div>
</div>

<!-- DAY TABS -->
<div class="day-tabs" id="dayTabs"></div>

<!-- MAIN -->
<div class="main">

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">-</div><div class="stat-label">Shifts</div></div>
    <div class="stat"><div class="stat-val" id="statPit">-</div><div class="stat-label">Pit</div></div>
    <div class="stat"><div class="stat-val" id="statScouting">-</div><div class="stat-label">Scouting</div></div>
    <div class="stat"><div class="stat-val" id="statPeople">-</div><div class="stat-label">People</div></div>
  </div>

  <!-- ADD SHIFT -->
  <div class="section-label">Add Shift</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <select id="addName"><option value="">Loading...</option></select>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="addType">
          <option value="pit">Pit</option>
          <option value="scouting">Scouting</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="addDate" />
      </div>
      <div class="form-group">
        <label>Start</label>
        <input type="text" id="addStart" placeholder="10:00 AM" />
      </div>
      <div class="form-group">
        <label>End</label>
        <input type="text" id="addEnd" placeholder="10:45 AM" />
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-red" onclick="addRow()">+ Add Shift</button>
      <button class="btn btn-outline" onclick="clearSentFlags()">Reset Notif Flags</button>
    </div>
  </div>

  <!-- BULK IMPORT -->
  <div class="section-label">Bulk Import CSV</div>
  <div class="card">
    <p style="font-size:0.76rem;color:var(--gray);margin-bottom:10px;">Paste CSV rows (Name,Type,Date,Start,End) — one per line, no header.</p>
    <textarea id="csvInput" placeholder="Grant Brady,pit,2026-04-05,7:45 AM,11:00 AM"></textarea>
    <br/><br/>
    <button class="btn btn-red" onclick="bulkImport()">Import Rows</button>
  </div>

  <!-- SCHEDULE -->
  <div class="section-label">Schedule</div>
  <div class="card">
    <div class="toolbar">
      <span class="toolbar-label">Type:</span>
      <select id="filterType" onchange="renderTable()">
        <option value="">All</option>
        <option value="pit">Pit</option>
        <option value="scouting">Scouting</option>
      </select>
      <span class="toolbar-label">Time:</span>
      <select id="filterTime" onchange="renderTable()">
        <option value="">All</option>
        <option value="active">Now &amp; upcoming</option>
        <option value="past">Past</option>
      </select>
      <div class="toolbar-gap"></div>
      <button class="btn btn-outline" style="font-size:0.74rem;padding:7px 10px;" onclick="printSchedule()">Print</button>
    </div>

    <!-- Desktop table -->
    <div class="table-scroll">
      <div id="tableWrap"><div class="empty"><span class="spinner"></span> Loading...</div></div>
    </div>

    <!-- Mobile cards -->
    <div class="shift-cards" id="cardsWrap"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var allRows    = [];
var activeDate = '';

window.onload = function() {
  loadNames();
  loadSchedule();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(refreshTimeSensitiveUI, 30000);
};

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function loadNames() {
  google.script.run
    .withSuccessHandler(function(list) {
      var sel = document.getElementById('addName');
      sel.innerHTML = '<option value="">Select name...</option>';
      list.forEach(function(n) {
        var o = document.createElement('option');
        o.value = n; o.textContent = n; sel.appendChild(o);
      });
    }).getNameList();
}

function loadSchedule() {
  document.getElementById('tableWrap').innerHTML = '<div class="empty"><span class="spinner"></span> Loading...</div>';
  document.getElementById('cardsWrap').innerHTML = '<div class="empty"><span class="spinner"></span> Loading...</div>';
  google.script.run
    .withSuccessHandler(function(rows) {
      allRows = rows;
      buildDayTabs(rows);
      updateStats(rows);
      updateNowAndNext();
      renderTable();
    })
    .withFailureHandler(function(e) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
      document.getElementById('cardsWrap').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
    })
    .getSchedule();
}

function buildDayTabs(rows) {
  var dates = {};
  rows.forEach(function(r) { if (r.date) dates[r.date] = true; });
  var allDates = Object.keys(dates).sort();
  var container = document.getElementById('dayTabs');
  container.innerHTML = '';

  var allTab = document.createElement('button');
  allTab.className = 'day-tab' + (activeDate === '' ? ' active' : '');
  allTab.textContent = 'All';
  allTab.onclick = function() { setActiveDate(''); };
  container.appendChild(allTab);

  allDates.forEach(function(d) {
    var tab = document.createElement('button');
    tab.className = 'day-tab' + (activeDate === d ? ' active' : '');
    var dt = new Date(d + 'T12:00:00');
    tab.textContent = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    tab.onclick = function() { setActiveDate(d); };
    container.appendChild(tab);
  });
}

function setActiveDate(date) {
  activeDate = date;
  buildDayTabs(allRows);
  renderTable();
}

function updateNowAndNext() {
  var now = new Date();
  var onNow = [], upcoming = [];

  allRows.forEach(function(r) {
    if (!r.date || !r.start || !r.end) return;
    var s = parseTime(r.date, r.start);
    var e = parseTime(r.date, r.end);
    if (!s || !e) return;
    if (now >= s && now < e) { onNow.push(r); }
    else if (s > now && (s - now) < 60 * 60 * 1000) { upcoming.push({ row: r, diff: s - now, start: s }); }
  });

  upcoming.sort(function(a, b) { return a.diff - b.diff; });

  var nowGrid = document.getElementById('nowGrid');
  nowGrid.innerHTML = onNow.length === 0
    ? '<div class="now-empty">Nobody scheduled right now</div>'
    : onNow.map(function(r) {
        return '<div class="now-card ' + r.type + '"><div class="now-name">' + esc(r.name) + '</div><div class="now-meta">' + (r.type === 'scouting' ? 'Scouting' : 'Pit') + ' until ' + esc(r.end) + '</div></div>';
      }).join('');

  var nextEl = document.getElementById('nextUpItems');
  nextEl.innerHTML = upcoming.length === 0
    ? '<span style="font-size:0.76rem;color:var(--gray-dim);">Nothing in the next hour</span>'
    : upcoming.slice(0, 3).map(function(u) {
        var mins = Math.round(u.diff / 60000);
        return '<div class="nextup-item">' + esc(u.row.name) + ' &mdash; ' + (u.row.type === 'scouting' ? 'Scouting' : 'Pit') + ' at ' + esc(u.row.start) + '<span class="nextup-countdown">in ' + mins + 'min</span></div>';
      }).join('');
}

function parseTime(date, timeStr) {
  try {
    var m = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if (!m) return null;
    var h = parseInt(m[1]); var min = parseInt(m[2]); var p = m[3].toUpperCase();
    if (p === 'PM' && h !== 12) h += 12;
    if (p === 'AM' && h === 12) h = 0;
    var parts = date.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2], h, min, 0, 0);
  } catch(e) { return null; }
}

/** 'past' | 'now' | 'upcoming' | null if times not parseable */
function getShiftTimeStatus(r) {
  if (!r.date || !r.start || !r.end) return null;
  var s = parseTime(r.date, r.start);
  var e = parseTime(r.date, r.end);
  if (!s || !e) return null;
  var now = new Date();
  if (now >= e) return 'past';
  if (now >= s && now < e) return 'now';
  return 'upcoming';
}

function refreshTimeSensitiveUI() {
  updateNowAndNext();
  renderTable();
}

function updateStats(rows) {
  var f = activeDate ? rows.filter(function(r) { return r.date === activeDate; }) : rows;
  document.getElementById('statTotal').textContent    = f.length;
  document.getElementById('statPit').textContent      = f.filter(function(r) { return r.type === 'pit'; }).length;
  document.getElementById('statScouting').textContent = f.filter(function(r) { return r.type === 'scouting'; }).length;
  document.getElementById('statPeople').textContent   = new Set(f.map(function(r) { return r.name; })).size;
}

function renderTable() {
  updateStats(allRows);
  var filterType = document.getElementById('filterType').value;
  var filterTime = document.getElementById('filterTime').value;
  var filtered = allRows.filter(function(r) {
    if (activeDate && r.date !== activeDate) return false;
    if (filterType && r.type !== filterType) return false;
    var st = getShiftTimeStatus(r);
    if (filterTime === 'past') {
      if (st !== 'past') return false;
    } else if (filterTime === 'active') {
      if (st === 'past') return false;
      if (st === null) return true;
    }
    return true;
  });

  if (filtered.length === 0) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">No shifts found.</div>';
    document.getElementById('cardsWrap').innerHTML = '<div class="empty">No shifts found.</div>';
    return;
  }

  // Desktop table
  var html = '<table><thead><tr><th>Name</th><th>Type</th><th>Date</th><th>Start</th><th>End</th><th>Status</th><th>Sent</th><th></th></tr></thead><tbody>';
  filtered.forEach(function(r) {
    var bc = r.type === 'scouting' ? 'badge-scouting' : 'badge-pit';
    var tl = r.type === 'scouting' ? 'Scouting' : 'Pit';
    var st = getShiftTimeStatus(r);
    var statusBadge = '';
    var rowClass = '';
    if (st === 'past') {
      statusBadge = '<span class="badge badge-past" title="Shift end time has passed">Past</span>';
      rowClass = ' class="shift-past"';
    } else if (st === 'now') {
      statusBadge = '<span class="badge badge-live" title="Currently on this shift">On now</span>';
    } else if (st === 'upcoming') {
      statusBadge = '<span class="badge badge-upcoming" title="Shift has not started yet">Upcoming</span>';
    } else {
      statusBadge = '<span class="badge badge-upcoming" title="Could not parse times">—</span>';
    }
    var dots = '<span class="sent-dot ' + (r.sentHeadsup ? 'yes' : 'no') + '"></span>' +
               '<span class="sent-dot ' + (r.sentStart   ? 'yes' : 'no') + '"></span>' +
               '<span class="sent-dot ' + (r.sentEnd     ? 'yes' : 'no') + '"></span>';
    html += '<tr' + rowClass + '><td>' + esc(r.name) + '</td><td><span class="badge ' + bc + '">' + tl + '</span></td><td>' + esc(r.date) + '</td><td>' + esc(r.start) + '</td><td>' + esc(r.end) + '</td><td>' + statusBadge + '</td><td>' + dots + '</td>' +
      '<td><div class="actions-cell">' +
        '<button class="btn btn-sm" onclick="editRow(' + r.row + ')">Edit</button>' +
        '<button class="btn btn-resend" onclick="resendRow(' + r.row + ',\'' + esc(r.name) + '\')">Resend</button>' +
        '<button class="btn btn-danger" onclick="deleteRow(' + r.row + ',\'' + esc(r.name) + '\')">Del</button>' +
      '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  // Mobile cards
  var cards = filtered.map(function(r) {
    var bc = r.type === 'scouting' ? 'badge-scouting' : 'badge-pit';
    var tl = r.type === 'scouting' ? 'Scouting' : 'Pit';
    var st = getShiftTimeStatus(r);
    var statusBadge = '';
    var cardPast = '';
    if (st === 'past') {
      statusBadge = '<span class="badge badge-past">Past</span>';
      cardPast = ' shift-past';
    } else if (st === 'now') {
      statusBadge = '<span class="badge badge-live">On now</span>';
    } else if (st === 'upcoming') {
      statusBadge = '<span class="badge badge-upcoming">Upcoming</span>';
    } else {
      statusBadge = '<span class="badge badge-upcoming">—</span>';
    }
    var dots = '<span class="sent-dot ' + (r.sentHeadsup ? 'yes' : 'no') + '" title="Heads-up"></span>' +
               '<span class="sent-dot ' + (r.sentStart   ? 'yes' : 'no') + '" title="Start"></span>' +
               '<span class="sent-dot ' + (r.sentEnd     ? 'yes' : 'no') + '" title="End"></span>';
    return '<div class="shift-card' + cardPast + '">' +
      '<div class="shift-card-top"><span class="shift-card-name">' + esc(r.name) + '</span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"><span class="badge ' + bc + '">' + tl + '</span>' + statusBadge + '</span></div>' +
      '<div class="shift-card-meta">' + esc(r.date) + ' &nbsp; ' + esc(r.start) + ' &rarr; ' + esc(r.end) + ' &nbsp; ' + dots + '</div>' +
      '<div class="shift-card-actions">' +
        '<button class="btn btn-sm" onclick="editRow(' + r.row + ')">Edit</button>' +
        '<button class="btn btn-resend" onclick="resendRow(' + r.row + ',\'' + esc(r.name) + '\')">Resend</button>' +
        '<button class="btn btn-danger" onclick="deleteRow(' + r.row + ',\'' + esc(r.name) + '\')">Delete</button>' +
      '</div></div>';
  }).join('');
  document.getElementById('cardsWrap').innerHTML = cards;
}

function addRow() {
  var name = document.getElementById('addName').value.trim();
  var type = document.getElementById('addType').value;
  var date = document.getElementById('addDate').value;
  var start = document.getElementById('addStart').value.trim();
  var end = document.getElementById('addEnd').value.trim();
  if (!name || !date || !start || !end) { showToast('Fill in all fields.', true); return; }
  google.script.run
    .withSuccessHandler(function() { showToast('Shift added!'); document.getElementById('addStart').value = ''; document.getElementById('addEnd').value = ''; loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .addRow(name, type, date, start, end);
}

function editRow(rowIndex) {
  var entry = allRows.find(function(r) { return r.row === rowIndex; });
  if (!entry) return;
  var newStart = prompt('Start time:', entry.start); if (newStart === null) return;
  var newEnd   = prompt('End time:', entry.end);     if (newEnd === null) return;
  var newDate  = prompt('Date (YYYY-MM-DD):', entry.date); if (newDate === null) return;
  google.script.run
    .withSuccessHandler(function() { showToast('Updated!'); loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .updateRow(rowIndex, entry.name, entry.type, newDate, newStart, newEnd);
}

function deleteRow(rowIndex, name) {
  if (!confirm('Delete shift for ' + name + '?')) return;
  google.script.run
    .withSuccessHandler(function() { showToast('Deleted.'); loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .deleteRow(rowIndex);
}

function resendRow(rowIndex, name) {
  if (!confirm('Resend notifications for ' + name + '?')) return;
  google.script.run
    .withSuccessHandler(function() { showToast('Resent to ' + name + '!'); loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .resendRow(rowIndex);
}

function clearSentFlags() {
  if (!confirm('Reset ALL notification flags?')) return;
  google.script.run
    .withSuccessHandler(function() { showToast('All flags reset!'); loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .clearAllSentFlags();
}

function bulkImport() {
  var raw = document.getElementById('csvInput').value.trim();
  if (!raw) { showToast('Paste some CSV rows first.', true); return; }
  var rows = [], errors = [];
  raw.split('\n').forEach(function(line, idx) {
    var p = line.split(',');
    if (p.length < 5) { errors.push('Line ' + (idx+1) + ': not enough columns'); return; }
    rows.push({ name: p[0].trim(), type: p[1].trim(), date: p[2].trim(), start: p[3].trim(), end: p[4].trim() });
  });
  if (errors.length) { showToast(errors[0], true); return; }
  google.script.run
    .withSuccessHandler(function(count) { showToast('Imported ' + count + ' rows!'); document.getElementById('csvInput').value = ''; loadSchedule(); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .bulkAddRows(rows);
}

function printSchedule() {
  var filtered = activeDate ? allRows.filter(function(r) { return r.date === activeDate; }) : allRows;
  var rows = filtered.map(function(r) {
    return '<tr><td>' + esc(r.name) + '</td><td>' + r.type + '</td><td>' + r.date + '</td><td>' + r.start + '</td><td>' + r.end + '</td></tr>';
  }).join('');
  var win = window.open('', '_blank');
  win.document.write('<html><head><title>MECO 8324 Schedule</title><style>body{font-family:sans-serif;padding:20px;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:8px;}th{background:#eee;}</style></head><body><h2>MECO 8324 Schedule' + (activeDate ? ' — ' + activeDate : '') + '</h2><table><thead><tr><th>Name</th><th>Type</th><th>Date</th><th>Start</th><th>End</th></tr></thead><tbody>' + rows + '</tbody></table></body></html>');
  win.document.close(); win.print();
}

function postSchedule() {
  showToast('Posting to Slack...');
  google.script.run
    .withSuccessHandler(function() { showToast('Posted to #tallahassee-2026!'); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .runPostSchedule();
}

function activateNotifications() {
  showToast('Activating...');
  google.script.run
    .withSuccessHandler(function() { showToast('Notifications active — firing every minute.'); })
    .withFailureHandler(function(e) { showToast('Error: ' + e.message, true); })
    .runInstallTrigger();
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (isError ? 'toast-err' : 'toast-ok');
  clearTimeout(window._tt);
  window._tt = setTimeout(function() { t.className = 'toast'; }, 3500);
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
